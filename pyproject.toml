[project]
name = "sinonom-review"
version = "0.1.0"
description = "Session-based review of exported SinoNom annotations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio==6.28.0",
    "Pillow==12.3.0",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
# The AutoHDR adapter remains optional: manual review never imports this ML stack. MMDetection is installed separately because the
# correct MMCV build depends on the external DINO config, Torch, and accelerator.
text-detection = [
    "torch>=2.6",
    "torchvision>=0.21",
    "opencv-python-headless>=4.10",
    "shapely>=2.0",
]
